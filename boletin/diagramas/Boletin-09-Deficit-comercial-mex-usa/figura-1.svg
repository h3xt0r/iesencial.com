 stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="121" y="318.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="121" dy="0">Imponer aranceles y</tspan><tspan x="121" dy="17.666667">restringir las importaciones</tspan><tspan x="121" dy="17.666667">desde México</tspan></text></g><g class="RF9wcmltYQ=="><g class="shape" ><rect x="330" y="280" width="272" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="466" y="318.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="466" dy="0">Subordinar la política comercial</tspan><tspan x="466" dy="17.666667">a la integración física y</tspan><tspan x="466" dy="17.666667">logística binacional</tspan></text></g><g class="KEEgLSZndDsgQilbMF0="><marker id="mk-d2-2292737371-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 196 100 L 196 136" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2292737371-3488378134)" mask="url(#d2-2292737371)" /><text x="250" y="125" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">Para asegurar</text></g><g class="KEEgLSZndDsgQylbMF0="><path d="M 386 100 L 386 136" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2292737371-3488378134)" mask="url(#d2-2292737371)" /><text x="440" y="125" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">Para asegurar</text></g><g class="KEIgLSZndDsgRClbMF0="><path d="M 121 240 L 121 276" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2292737371-3488378134)" mask="url(#d2-2292737371)" /><text 